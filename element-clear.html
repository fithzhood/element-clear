<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#0a0c14">
<meta name="mobile-web-app-capable" content="yes">
<title>Element Battle</title>
<link rel="icon" href="Element.png">
<link rel="stylesheet" href="element-clear.css?v=3">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="sig-fire" viewBox="0 0 24 24">
    <path d="M12 3.4 21 20.4H3Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="sig-water" viewBox="0 0 24 24">
    <path d="M12 20.6 3 3.6h18Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="sig-nature" viewBox="0 0 24 24">
    <path d="M12 20.6 3 3.6h18Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M7.4 10.4h9.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="sig-light" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M12 1.6v3.1M12 19.3v3.1M1.6 12h3.1M19.3 12h3.1"/>
      <path d="M4.6 4.6 6.8 6.8M17.2 17.2l2.2 2.2M19.4 4.6 17.2 6.8M6.8 17.2 4.6 19.4"/>
    </g>
  </symbol>
  <symbol id="sig-darkness" viewBox="0 0 24 24">
    <path d="M13.1 2.6a9.4 9.4 0 1 0 8.3 12.2A7.6 7.6 0 0 1 13.1 2.6Z" fill="currentColor"/>
  </symbol>
</defs></svg>

<div id="app" data-element="fire">

  <div id="fx-backdrop"></div>
  <div id="fx-swirl"></div>
  <div id="fx-vignette"></div>

  <!-- ------------------------------------------------------ schermata iniziale -->
  <div id="start">
    <div class="start-mark"><img src="Element.png" alt=""></div>
    <h1>Element<br><span>Battle</span></h1>
    <p class="start-best">best <b id="start-best">10</b></p>
    <div class="start-buttons">
      <button id="btn-new" class="big-btn primary">New Game</button>
      <button id="btn-continue" class="big-btn">Continue</button>
    </div>
    <p class="start-hint">Five elements. One enemy at a time. Spend your last attack and it ends.</p>
  </div>

  <!-- ------------------------------------------------------------------ partita -->
  <main id="game" hidden>

    <header id="topbar">
      <div class="chip best"><span class="lbl">BEST</span><span id="best-val">10</span></div>
      <div class="chip wave"><span class="lbl">WAVE</span><span id="wave-val">1</span></div>
      <div class="chip endless" id="endless-tag" hidden>∞</div>
      <div class="spacer"></div>
      <button id="btn-sound" class="chip icon" aria-label="Sound on">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/><path class="wave1" d="M15.5 9a4.2 4.2 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="wave2" d="M18.3 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M4 20 20 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="chip next" id="next-chip"><span class="lbl">NEXT</span><span class="sigil-slot"></span></div>
    </header>

    <section id="arena">
      <div id="enemy-head">
        <div id="boss-ribbon" hidden>BOSS</div>
        <div id="enemy-name">—</div>
      </div>

      <div id="hpbar">
        <div id="hp-ghost"></div>
        <div id="hp-fill"></div>
        <div id="hp-text">10 / 10</div>
      </div>

      <div id="portrait-wrap">
        <div id="portrait">
          <div id="portrait-art"></div>
          <div id="portrait-frame"></div>
          <button id="badge" aria-label="Enemy element"></button>
        </div>
        <canvas id="particles"></canvas>
      </div>
    </section>

    <div id="shelf" hidden></div>

    <section id="quest" class="empty"></section>

    <section id="attacks"></section>
  </main>

  <!-- --------------------------------------------------------------- ricompense -->
  <div id="reward" class="overlay" hidden>
    <div class="overlay-box">
      <h2 id="reward-title">Choose your spoils</h2>
      <div id="reward-next" hidden>
        <span class="rn-lbl">next enemy</span>
        <span class="rn-sigil"></span>
        <span class="rn-main">
          <span class="rn-name">—</span>
          <span class="rn-meta"></span>
        </span>
        <span class="rn-boss" hidden>BOSS</span>
      </div>
      <div id="reward-legend" hidden></div>
      <div id="reward-inner"></div>
    </div>
  </div>

  <div id="ending" class="overlay" hidden>
    <div class="overlay-box narrow ending-box">
      <div class="ending-crest"><img src="Element.png" alt=""></div>
      <h2>The last dark falls</h2>
      <p class="ending-lead">Ninety-one waves. Every element bent, every boss broken. The campaign is over.</p>
      <div id="ending-stats"></div>
      <div class="start-buttons">
        <button id="btn-endless" class="big-btn primary">Endless run</button>
        <button id="btn-ending-menu" class="big-btn">Menu</button>
      </div>
    </div>
  </div>

  <div id="gameover" class="overlay" hidden>
    <div class="overlay-box narrow">
      <h2>Out of attacks</h2>
      <p id="gameover-score"></p>
      <div class="start-buttons">
        <button id="btn-retry" class="big-btn primary">Try again</button>
        <button id="btn-menu" class="big-btn">Menu</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="element-data.js?v=3"></script>
<script src="element-clear.js?v=3"></script>
</body>
</html>
